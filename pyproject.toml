[project]
name = "bcp-protocol"
version = "2026.04.08"
description = "Brazilian Commerce Protocol"
readme = "README.md"
requires-python = ">=3.13"

# The spec (JSON Schemas). Ships no python: the UCP spec repo uses
# `[tool.setuptools] packages = []` for the same reason; `package = false`
# is the uv equivalent (nothing to build or install).
[tool.uv]
package = false

[dependency-groups]
playground = [
    "a2a-sdk==1.1.0",
    "cryptography>=49",
    "jsonschema>=4.26",
    "referencing>=0.36",
]
docs = [
    "mike==2.1.3",
    "mkdocs-llmstxt==0.5.0",
    "mkdocs-macros-plugin==1.4.0",
    "mkdocs-material[imaging]>=9.5.0",
    "mkdocs-redirects==1.2.2",
    "mkdocs-site-urls==0.3.1",
    "pyyaml>=6.0.3",
]
